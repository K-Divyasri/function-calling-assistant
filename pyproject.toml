[project]
name = "tool-agent"
version = "0.1.0"
description = "A function-calling assistant: an LLM that decides which tool to run, with a full offline mode."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# The real-LLM path. Everything works offline without these.
real = ["litellm>=1.40", "python-dotenv>=1.0"]
# Live (keyless) weather via Open-Meteo.
weather = ["requests>=2.28"]
# The Streamlit web app.
app = ["streamlit>=1.30", "requests>=2.28"]
dev = ["pytest>=7.0"]

[project.scripts]
tool-agent = "tool_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tool_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
